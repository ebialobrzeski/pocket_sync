# Built locally from this repository (e.g. a Dockhand Git stack): the image is built from ./Dockerfile.
# Needs a `.env` next to this file (see .env.example), then:
#   docker compose up -d --build
services:
  pocket-sync:
    image: pocket-sync:local
    build:
      context: .
    pull_policy: build
    container_name: pocket-sync
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      # Optional: variables may instead come from the stack configuration (e.g. Dockhand).
      - path: .env
        required: false
    environment:
      POCKET_API_KEY: ${POCKET_API_KEY:-}
      TZ: ${TZ:-UTC}
      # POCKET_API_KEY_FILE: /run/secrets/pocket_api_key
    volumes:
      # SSD share: metadata (/data/meta) and state DB + logs (/data/state)
      - ${POCKET_SSD_PATH:?set POCKET_SSD_PATH in .env}:/data
      # HDD share: audio files
      - ${POCKET_HDD_PATH:?set POCKET_HDD_PATH in .env}:/audio
    # secrets:
    #   - pocket_api_key
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# secrets:
