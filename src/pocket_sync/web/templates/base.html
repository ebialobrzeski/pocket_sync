<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Pocket archive{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v={{ version }}">
  <script src="{{ url_for('static', path='app.js') }}?v={{ version }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
{% block header %}
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Zm-7 9a1 1 0 1 1 2 0 5 5 0 0 0 10 0 1 1 0 1 1 2 0 7 7 0 0 1-6 6.93V21a1 1 0 1 1-2 0v-2.07A7 7 0 0 1 5 12Z"/></svg>
      Pocket archive
    </a>
    <nav class="nav">
      <a href="/" class="{{ 'active' if request.url.path == '/' or request.url.path.startswith('/recordings') }}">Recordings</a>
      <a href="/settings" class="{{ 'active' if request.url.path.startswith('/settings') }}">Sync</a>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="link" type="submit">Log out</button>
      </form>
    </nav>
  </div>
</header>
{% endblock %}
<main class="wrap">
  {% for kind, message in messages %}
  <div class="flash flash-{{ kind }}" role="status">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
